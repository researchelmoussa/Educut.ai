# EduCut Connect: publishes the LinkedIn posts queued by the linkedin agent (connect/linkedin/queue.json)
# on the "EduCut Connect" page when their time comes. One post per run at most, so catch-up posts stay
# spaced. Needs the repository secrets LINKEDIN_ACCESS_TOKEN and LINKEDIN_ORGANIZATION_ID; without them
# the job does nothing. Set publishing.enabled to false in connect/config/connect.config.json to pause.
name: LinkedIn publisher

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: linkedin-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish due posts
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORGANIZATION_ID: ${{ secrets.LINKEDIN_ORGANIZATION_ID }}
        run: node connect/cli.mjs li-publish-due --run "$RUNNER_TEMP/connect-run"
      - name: Record published posts
        run: |
          if ! git diff --quiet connect/linkedin/queue.json; then
            git config user.name "educut-connect-bot"
            git config user.email "educut-connect-bot@users.noreply.github.com"
            git add connect/linkedin/queue.json
            git commit -m "EduCut Connect: LinkedIn posts published"
            git pull --rebase origin main && git push origin HEAD:main
          fi
